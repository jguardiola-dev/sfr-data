name: partidos

# partidos.json (próximos, en curso y recientes de AoE II, de Liquipedia) cada 2 horas. Ligero: 1 petición a Liquipedia
# (action=parse), sin dependencias. Publica SOLO partidos.json en la rama data, encima de su último commit (los demás
# archivos quedan tal cual). Comparte grupo de concurrencia con data.yml: nunca corren a la vez, así que el build nocturno
# (que rehace la rama data con un commit huérfano y push --force) no pisa ni es pisado por esta publicación.

on:
  schedule:
    - cron: "41 */2 * * *"   # cada 2 horas, en el minuto 41 (lejos de las horas en punto, que GitHub retrasa)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos               # el mismo que data.yml
  cancel-in-progress: false

jobs:
  partidos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: partidos.json anterior (rama data)
        id: previo
        run: |
          if git fetch -q origin data:refs/remotes/origin/data 2>/dev/null; then
            git checkout origin/data -- partidos.json 2>/dev/null && echo "recuperado partidos.json anterior" || echo "la rama data aún no tiene partidos.json"
            git reset -q partidos.json 2>/dev/null || true
            echo "hay_data=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=partidos::todavía no hay rama data: la crea el build nocturno (data.yml); no se publica nada"
            echo "hay_data=0" >> "$GITHUB_OUTPUT"
          fi
      - name: generar partidos.json
        run: python build_data.py partidos
        continue-on-error: true    # si falla, partidos() ya deja el anterior y avisa
      - name: publicar (solo partidos.json, encima de la rama data)
        if: steps.previo.outputs.hay_data == '1' && hashFiles('partidos.json') != ''
        run: |
          cp partidos.json "$RUNNER_TEMP/partidos.json"
          git config user.name "sfr-data bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -q -f -B publicacion origin/data
          cp "$RUNNER_TEMP/partidos.json" partidos.json
          # sin cambios salvo «generado» → no se publica (evita un commit cada 2 h que no cambia nada)
          if git cat-file -e HEAD:partidos.json 2>/dev/null && python3 - <<'EOF'
          import json, subprocess, sys
          viejo = json.loads(subprocess.run(["git", "show", "HEAD:partidos.json"], capture_output=True, check=True).stdout)
          nuevo = json.load(open("partidos.json", encoding="utf-8"))
          for d in (viejo, nuevo):
              d.pop("generado", None)
              d.pop("ventana", None)
              (d.get("fuente") or {}).pop("generado", None)
          sys.exit(0 if viejo == nuevo else 1)
          EOF
          then echo "partidos.json sin cambios"; exit 0; fi
          git add -f partidos.json
          git commit -q -m "partidos $(date -u '+%F %H:%M UTC')" || { echo "nada que publicar"; exit 0; }
          git push -q origin HEAD:data     # avance normal, sin --force: si la rama cambió entre medias, falla y no pisa nada
          echo "partidos.json publicado en la rama data"
