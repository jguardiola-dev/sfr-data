name: partidos

# partidos.json (próximos, en curso y recientes de AoE II, de Liquipedia) cada 2 horas. Ligero: 1 petición a Liquipedia
# (action=parse), sin dependencias. Publica SOLO partidos.json en la rama data, encima de su último commit (los demás
# archivos quedan tal cual). Comparte grupo de concurrencia con data.yml: nunca corren a la vez, así que el build nocturno
# (que rehace la rama data con un commit huérfano y push --force) no pisa ni es pisado por esta publicación.
# Además publica torneos_comunidad.json (torneos pequeños de gamenex.gg): UNA petición más a gamenex, en el mismo paso.

on:
  schedule:
    - cron: "41 */2 * * *"   # cada 2 horas, en el minuto 41 (lejos de las horas en punto, que GitHub retrasa)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos               # el mismo que data.yml
  cancel-in-progress: false

jobs:
  partidos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: partidos.json anterior (rama data)
        id: previo
        run: |
          if git fetch -q origin data:refs/remotes/origin/data 2>/dev/null; then
            git checkout origin/data -- partidos.json 2>/dev/null && echo "recuperado partidos.json anterior" || echo "la rama data aún no tiene partidos.json"
            git reset -q partidos.json 2>/dev/null || true
            git checkout origin/data -- torneos_comunidad.json 2>/dev/null && echo "recuperado torneos_comunidad.json anterior" || echo "la rama data aún no tiene torneos_comunidad.json"
            git reset -q torneos_comunidad.json 2>/dev/null || true
            echo "hay_data=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=partidos::todavía no hay rama data: la crea el build nocturno (data.yml); no se publica nada"
            echo "hay_data=0" >> "$GITHUB_OUTPUT"
          fi
      - name: generar partidos.json
        run: python build_data.py partidos
        continue-on-error: true    # si falla, partidos() ya deja el anterior y avisa
      - name: generar torneos_comunidad.json (gamenex.gg)
        run: python build_data.py comunidad
        continue-on-error: true    # si falla, comunidad() ya deja el anterior y avisa; nunca rompe el workflow
      - name: publicar (solo partidos.json, encima de la rama data)
        if: steps.previo.outputs.hay_data == '1' && hashFiles('partidos.json') != ''
        run: |
          cp partidos.json "$RUNNER_TEMP/partidos.json"
          [ -f torneos_comunidad.json ] && cp torneos_comunidad.json "$RUNNER_TEMP/torneos_comunidad.json" || true
          git config user.name "sfr-data bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -q -f -B publicacion origin/data
          cp "$RUNNER_TEMP/partidos.json" partidos.json
          [ -f "$RUNNER_TEMP/torneos_comunidad.json" ] && cp "$RUNNER_TEMP/torneos_comunidad.json" torneos_comunidad.json || true
          # sin cambios salvo «generado» en NINGUNO de los dos archivos → no se publica (evita un commit cada 2 h que no cambia nada)
          if python3 - <<'EOF'
          import json, os, subprocess, sys
          for nombre in ("partidos.json", "torneos_comunidad.json"):
              if not os.path.exists(nombre):
                  continue
              r = subprocess.run(["git", "show", "HEAD:" + nombre], capture_output=True)
              if r.returncode != 0:
                  sys.exit(1)          # el archivo aún no está en la rama data: hay que publicarlo
              viejo, nuevo = json.loads(r.stdout), json.load(open(nombre, encoding="utf-8"))
              for d in (viejo, nuevo):
                  d.pop("generado", None)
                  d.pop("ventana", None)
                  (d.get("fuente") or {}).pop("generado", None)
              if viejo != nuevo:
                  sys.exit(1)
          sys.exit(0)
          EOF
          then echo "partidos.json y torneos_comunidad.json sin cambios"; exit 0; fi
          git add -f partidos.json
          [ -f torneos_comunidad.json ] && git add -f torneos_comunidad.json || true
          git commit -q -m "partidos $(date -u '+%F %H:%M UTC')" || { echo "nada que publicar"; exit 0; }
          git push -q origin HEAD:data     # avance normal, sin --force: si la rama cambió entre medias, falla y no pisa nada
          echo "partidos.json (y torneos_comunidad.json) publicado en la rama data"
