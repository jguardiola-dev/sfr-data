name: datos

on:
  schedule:
    - cron: "17 5 * * *"     # todos los días a las 05:17 UTC
  workflow_dispatch:         # y a mano, con el botón "Run workflow"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow
      - run: python build_data.py
      - name: publicar
        run: |
          git config user.name "sfr-data bot"
          git config user.email "bot@users.noreply.github.com"
          git add ladder.json clans.json.gz civstats.json || true
          git commit -m "datos $(date -u +%F)" || echo "sin cambios"
          git push
