name: datos

on:
  schedule:
    - cron: "17 5 * * *"     # todos los días a las 05:17 UTC
  workflow_dispatch:         # y a mano, con el botón "Run workflow"

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: dependencias
        run: pip install pandas pyarrow numpy
      - name: datos previos (rama data)
        run: |
          if git fetch -q --depth=1 origin data:refs/remotes/origin/data 2>/dev/null; then
            for p in civstats ladder.json clans.json.gz dispersion.json.gz mapas.json; do
              git checkout origin/data -- "$p" 2>/dev/null || true
            done
            echo "recuperados de la rama data: $(ls civstats/dias 2>/dev/null | wc -l) días"
          else
            echo "todavía no hay rama data (primera ejecución)"
          fi
      - name: generar datos
        run: python build_data.py
        continue-on-error: true    # si una parte falla, se publica lo que haya salido bien y lo recuperado
      - name: publicar perfiles (releases «perfiles» y base)
        if: hashFiles('perfiles/index.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # subida con respeto a los límites de GitHub (≈500 creaciones/hora): una cada 8 s y reintentos con espera
          subir() { local rel="$1"; shift; for f in "$@"; do for i in 1 2 3 4 5 6; do if gh release upload "$rel" "$f" --clobber; then break; else echo "reintento $i: $f"; sleep $((60 * i)); fi; done; sleep 8; done; }
          gh release view perfiles >/dev/null 2>&1 || gh release create perfiles --title "perfiles precalculados" --notes "Índice, deltas diarios, ELO nocturno y muestra para aoe2radar. Los paquetes base van en una release propia (perfiles-base-*). No es una versión: es un almacén de datos." --latest=false
          if [ -f perfiles/BASE_TAG ]; then
            tag=$(cat perfiles/BASE_TAG)
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "Paquetes base de perfiles (aoe2radar). Almacén de datos, no una versión." --latest=false
            subir "$tag" perfiles/base/shard-*.json.gz
          fi
          for m in perfiles/BORRAR-*; do [ -e "$m" ] || continue; a=$(basename "$m"); a=${a#BORRAR-}; gh release delete-asset perfiles "$a" -y || true; rm -f "$m"; sleep 2; done
          subir perfiles $(ls perfiles/*.json.gz)
          gh release upload perfiles perfiles/index.json --clobber
          # la release base anterior se borra entera (una sola llamada) una vez publicado el índice nuevo
          ant=$(python3 -c "import json;print(json.load(open('perfiles/index.json')).get('base_release_anterior') or '')")
          act=$(python3 -c "import json;print(json.load(open('perfiles/index.json')).get('base_release') or '')")
          if [ -n "$ant" ] && [ "$ant" != "$act" ]; then gh release delete "$ant" -y --cleanup-tag || true; fi
          limite=$(date -u -d "9 days ago" +%F)
          for a in $(gh release view perfiles --json assets -q '.assets[].name' | grep -E '^elo-[0-9]{4}-[0-9]{2}-[0-9]{2}\.json\.gz$'); do
            f=${a#elo-}; f=${f%.json.gz}
            if [[ "$f" < "$limite" ]]; then gh release delete-asset perfiles "$a" -y || true; sleep 2; fi
          done
          echo "perfiles publicados"
      - name: publicar (rama data, un solo commit)
        run: |
          git config user.name "sfr-data bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -q --orphan publicacion
          git rm -r -q -f --cached . 2>/dev/null || true
          for f in ladder.json clans.json.gz dispersion.json.gz mapas.json; do
            [ -f "$f" ] && git add -f "$f" || true
          done
          [ -d civstats ] && git add -f civstats || true
          git commit -q -m "datos $(date -u '+%F %H:%M UTC')" || { echo "nada que publicar"; exit 0; }
          git push --force -q origin HEAD:data
          echo "publicado en la rama data: $(git ls-files | wc -l) archivos"
