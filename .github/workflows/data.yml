name: datos

on:
  schedule:
    - cron: "17 5 * * *"     # todos los días a las 05:17 UTC
  workflow_dispatch:         # y a mano, con el botón "Run workflow"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: archivos del repo
        run: ls -la
      - name: dependencias
        run: pip install pandas pyarrow
      - name: generar datos
        run: python build_data.py
        continue-on-error: true    # civstats es best-effort: si falla, se publica lo que haya salido bien
      - name: publicar
        run: |
          git config user.name "sfr-data bot"
          git config user.email "bot@users.noreply.github.com"
          for f in ladder.json clans.json.gz civstats.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          git commit -m "datos $(date -u +%F)" || echo "sin cambios"
          git push
