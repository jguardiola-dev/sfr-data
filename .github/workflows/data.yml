name: datos

on:
  schedule:
    - cron: "17 5 * * *"     # todos los días a las 05:17 UTC
  workflow_dispatch:         # y a mano, con el botón "Run workflow"

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: dependencias
        run: pip install pandas pyarrow numpy
      - name: datos previos (rama data)
        run: |
          if git fetch -q --depth=1 origin data:refs/remotes/origin/data 2>/dev/null; then
            for p in civstats ladder.json clans.json.gz dispersion.json.gz mapas.json; do
              git checkout origin/data -- "$p" 2>/dev/null || true
            done
            echo "recuperados de la rama data: $(ls civstats/dias 2>/dev/null | wc -l) días"
          else
            echo "todavía no hay rama data (primera ejecución)"
          fi
      - name: generar datos
        run: python build_data.py
        continue-on-error: true    # si una parte falla, se publica lo que haya salido bien y lo recuperado
      - name: publicar perfiles (release «perfiles», assets)
        if: hashFiles('perfiles/index.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view perfiles >/dev/null 2>&1 || gh release create perfiles --title "perfiles precalculados" --notes "Registro de partidas por jugador (último año, top 20.000 1v1 + top 10.000 equipos) para aoe2radar. Se regenera cada noche. No es una versión: es un almacén de datos." --latest=false
          gh release upload perfiles perfiles/index.json perfiles/*.json.gz --clobber
          # los snapshots diarios de ELO (elo-AAAA-MM-DD) solo hacen falta 9 días: se borran los viejos
          limite=$(date -u -d "9 days ago" +%F)
          for a in $(gh release view perfiles --json assets -q '.assets[].name' | grep -E '^elo-[0-9]{4}-[0-9]{2}-[0-9]{2}\.json\.gz$'); do
            f=${a#elo-}; f=${f%.json.gz}
            if [[ "$f" < "$limite" ]]; then gh release delete-asset perfiles "$a" -y || true; fi
          done
          echo "perfiles publicados: $(ls perfiles | wc -l) archivos"
      - name: publicar (rama data, un solo commit)
        run: |
          git config user.name "sfr-data bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -q --orphan publicacion
          git rm -r -q -f --cached . 2>/dev/null || true
          for f in ladder.json clans.json.gz dispersion.json.gz mapas.json; do
            [ -f "$f" ] && git add -f "$f" || true
          done
          [ -d civstats ] && git add -f civstats || true
          git commit -q -m "datos $(date -u '+%F %H:%M UTC')" || { echo "nada que publicar"; exit 0; }
          git push --force -q origin HEAD:data
          echo "publicado en la rama data: $(git ls-files | wc -l) archivos"
